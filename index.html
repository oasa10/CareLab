<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#214f46" />
    <meta
      name="description"
      content="Un espacio para cuidar sin desaparecer. Una situación real, un paso posible y un retorno, con el Método BrainBox 1.2."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://carelab-sugerencias.oasa10.chatgpt.site; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>CareLab · Un paso posible, también para ti</title>
    <link rel="icon" href="assets/img/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/icono-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="assets/v2/style.css" />
    <link rel="stylesheet" href="assets/v2/didactic.css" />
    <link rel="stylesheet" href="assets/v2/brainbox.css" />
    <link rel="stylesheet" href="assets/v2/theme.css" />
    <link rel="stylesheet" href="assets/v2/recommendations.css" />
    <link rel="stylesheet" href="assets/v2/feedback.css" />
    <link rel="stylesheet" href="assets/v3/style.css" />
    <script type="module" src="assets/v2/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#contenido">Saltar al contenido</a>
    <div class="workspace">
      <header class="topbar quiet-header">
        <a class="quiet-brand" href="#/hoy" aria-label="CareLab, inicio"
          ><img src="assets/img/icono.svg" alt="" width="37" height="37" /><span
            >CareLab<small>CON EL MÉTODO BRAINBOX 1.2</small></span
          ></a
        >
        <nav id="navigation" aria-label="Navegación principal"></nav>
        <span id="breadcrumb"></span>
        <div class="top-actions">
          <div class="theme-picker">
            <label for="theme-always">Aspecto</label
            ><select
              id="theme-always"
              aria-label="Modo de visualización"
              data-theme-choice
            >
              <option value="light">Claro</option>
              <option value="system" selected>Sistema</option>
              <option value="dark">Oscuro</option>
            </select>
          </div>
          <button
            id="font-toggle"
            aria-label="Aumentar tamaño de texto"
            title="Letra grande"
          >
            Aa
          </button>
          <a href="#/ajustes" id="storage-indicator" class="session-pill"
            >Sesión recuperable</a
          >
          <a class="help-top" href="#/ayuda">Ayuda</a>
        </div>
      </header>
      <main id="contenido" tabindex="-1">
        <p class="loading">Preparando tu espacio…</p>
      </main>
      <footer class="footer">
        <span>CareLab 3.0 · Método BrainBox 1.2</span
        ><a href="#/feedback">Ayúdanos a mejorar</a
        ><a href="#/acerca">Cómo funciona y fuentes</a>
      </footer>
    </div>
    <nav class="mobile-nav" aria-label="Navegación móvil"></nav>
    <div id="player-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <noscript
      ><p>
        CareLab necesita JavaScript para usar las herramientas. Actívalo en tu
        navegador. Ante una emergencia en España, llama al 112.
      </p></noscript
    >
  </body>
</html>
